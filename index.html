        }

<body style="opacity:0">

<!-- Start it -->
<script>
window.onload = function(){
    window.loopy = new Loopy();

    // Grid toggle logic
    var gridToggle = document.getElementById('grid-toggle');
    var gridOverlay = document.getElementById('grid-overlay');
    gridToggle.onclick = function() {
        if (gridOverlay.classList.contains('show')) {
            gridOverlay.classList.remove('show');
        } else {
            gridOverlay.classList.add('show');
        }
    };
};
</script>
