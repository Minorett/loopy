<!-- Start it -->
<script>
window.onload = function(){
    window.loopy = new Loopy();

    // Grid toggle logic
    var gridToggle = document.getElementById('grid-toggle');
    var gridOverlay = document.getElementById('grid-overlay');
    gridToggle.onclick = function() {
        if (gridOverlay.classList.contains('show')) {
            gridOverlay.classList.remove('show');
        } else {
            gridOverlay.classList.add('show');
        }
    };

    // Sidebar toggle logic
    var sidebarToggle = document.getElementById('sidebar-toggle');
    var sidebar = document.getElementById('sidebar');
    sidebarToggle.onclick = function() {
        if (sidebar.classList.contains('show')) {
            sidebar.classList.remove('show');
        } else {
            sidebar.classList.add('show');
        }
    };

    // Recenter button logic
    var recenterButton = document.getElementById('recenter-button');
    recenterButton.onclick = function() {
        window.loopy.model.center(true);
        publish("resize");
    };

    // Auto-show sidebar when editing
    subscribe("sidebar/show", function() {
        sidebar.classList.add('show');
    });

    // Smooth Zoom System
    var canvasses = document.getElementById('canvasses');
    var loopyInstance = window.loopy;
    var MIN_SCALE = 0.2;
    var MAX_SCALE = 5.0;

    // Scroll wheel zoom (PC)
    canvasses.addEventListener('wheel', function(e) {
        e.preventDefault();
        var delta = e.deltaY || e.detail || -e.wheelDelta;
        var zoomFactor = delta > 0 ? 0.9 : 1.1;
        var newScale = loopyInstance.offsetScale * zoomFactor;
        newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));

        // Zoom toward center of drawing area
        var rect = canvasses.getBoundingClientRect();
        var centerX = rect.width / 2;
        var centerY = rect.height / 2;

        var scaleChange = newScale / loopyInstance.offsetScale;
        loopyInstance.offsetX = centerX - (centerX - loopyInstance.offsetX) * scaleChange;
        loopyInstance.offsetY = centerY - (centerY - loopyInstance.offsetY) * scaleChange;
        loopyInstance.offsetScale = newScale;
        console.log("Zoom Scale:", loopyInstance.offsetScale);

        publish("resize");
    }, { passive: false });

    // Pinch-to-zoom (Mobile)
    var lastTouchDistance = 0;
    var initialPinchScale = 1;
    var pinchCenterX = 0;
    var pinchCenterY = 0;

    function getTouchDistance(touch1, touch2) {
        var dx = touch1.clientX - touch2.clientX;
        var dy = touch1.clientY - touch2.clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    function getTouchCenter(touch1, touch2) {
        return {
            x: (touch1.clientX + touch2.clientX) / 2,
            y: (touch1.clientY + touch2.clientY) / 2
        };
    }

    canvasses.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
            e.preventDefault();
            lastTouchDistance = getTouchDistance(e.touches[0], e.touches[1]);
            initialPinchScale = loopyInstance.offsetScale;
            var center = getTouchCenter(e.touches[0], e.touches[1]);
            var rect = canvasses.getBoundingClientRect();
            pinchCenterX = center.x - rect.left;
            pinchCenterY = center.y - rect.top;
        }
    }, { passive: false });

    canvasses.addEventListener('touchmove', function(e) {
        if (e.touches.length === 2) {
            e.preventDefault();
            var currentDistance = getTouchDistance(e.touches[0], e.touches[1]);
            var scaleFactor = currentDistance / lastTouchDistance;
            var newScale = initialPinchScale * scaleFactor;
            newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
            
            // Zoom toward pinch center
            var center = getTouchCenter(e.touches[0], e.touches[1]);
            var rect = canvasses.getBoundingClientRect();
            var touchCenterX = center.x - rect.left;
            var touchCenterY = center.y - rect.top;
            
            var scaleChange = newScale / loopyInstance.offsetScale;
            loopyInstance.offsetX = touchCenterX - (touchCenterX - loopyInstance.offsetX) * scaleChange;
            loopyInstance.offsetY = touchCenterY - (touchCenterY - loopyInstance.offsetY) * scaleChange;
            loopyInstance.offsetScale = newScale;
            console.log("Zoom Scale:", loopyInstance.offsetScale);
            
            publish("resize");
            }
            }, { passive: false });
            };
            </script>
